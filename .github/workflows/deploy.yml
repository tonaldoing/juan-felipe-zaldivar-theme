name: Deploy Theme to Hostinger

on:
  push:
    branches: [master]
  workflow_dispatch:

# La carpeta destino es relativa a la raíz de la cuenta FTP, que en este
# hosting ya es el docroot de WordPress (ahí están wp-config.php y wp-content).
env:
  THEME_DIR: wp-content/themes/juan-felipe-zaldivar/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ env.THEME_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            .github/**
            package.json
            scripts/**
            docs/**
            README.md
            package-lock.json

      - name: Verificar que el tema quedó en su carpeta
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          echo "=== /wp-content/themes ==="
          curl -s --connect-timeout 30 --max-time 90 -u "$U:$P" --list-only "ftp://$H/wp-content/themes/" || true
          echo "=== /$THEME_DIR ==="
          curl -s --connect-timeout 30 --max-time 90 -u "$U:$P" --list-only "ftp://$H/$THEME_DIR" || true
          echo "=== restos de la subida anterior en /home (si los hay) ==="
          curl -s --connect-timeout 30 --max-time 90 -u "$U:$P" --list-only "ftp://$H/home/" || true
