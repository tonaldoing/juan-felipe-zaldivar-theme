name: Limpieza puntual del docroot

on:
  push:
    branches: [master]

# Elimina el arbol huerfano que dejaron los primeros deploys dentro del docroot:
# <docroot>/home/u125929690/... WordPress no usa esa ruta; la creo este mismo
# workflow de deploy al recibir una ruta absoluta como carpeta destino.
# Corre una sola vez y despues este archivo se borra del repo.
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar y limpiar
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
          ORPHAN: /home/u125929690/domains/sandybrown-jay-283993.hostingersite.com/public_html
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          run_lftp() { lftp -u "$U,$P" "$H" -e "set ssl:verify-certificate no; $1; bye"; }

          echo "=== ANTES: raiz del FTP (docroot de WordPress) ==="
          run_lftp "cls -1 /"

          # Salvaguarda 1: /home solo puede tener un hijo, la cuenta u125929690.
          HIJOS=$(run_lftp "cls -1 /home/" | sed 's#/*$##' | sed 's#.*/##' | grep -v '^$' || true)
          echo "Hijos de /home: [$HIJOS]"
          if [ "$HIJOS" != "u125929690" ]; then
            echo "Contenido inesperado en /home, no se elimina nada."
            exit 1
          fi

          # Salvaguarda 2: el arbol tiene que ser la copia del tema, no otra cosa.
          if ! run_lftp "cat $ORPHAN/style.css" | grep -q "Theme Name: Juan Felipe"; then
            echo "El arbol no contiene la copia del tema, no se elimina nada."
            exit 1
          fi
          echo "Confirmado: el arbol es la copia huerfana del tema."

          echo "=== Eliminando el arbol huerfano ==="
          run_lftp "rm -r /home"

          echo "=== DESPUES: raiz del FTP ==="
          run_lftp "cls -1 /"

          echo "=== El tema sigue en su carpeta ==="
          run_lftp "cls -1 /wp-content/themes/juan-felipe-zaldivar/"
